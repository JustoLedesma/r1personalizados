[package]
name = "r1-personalizados"
version = "2.0.0"
description = "R1 Personalizados - Sistema de Gestión Nativo"
authors = ["NETZ - R1 Personalizados"]
edition = "2021"

[lib]
name = "r1_personalizados_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.0.0", features = [] }

[dependencies]
tauri = { version = "^2.0.0", features = [] }
tauri-plugin-opener = "^2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

