name: Compilar Instaladores Nativos (Tauri v2)

on:
  workflow_dispatch: # Permite compilar manualmente con un clic en GitHub Actions
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    name: Compilar ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'Windows'
          - platform: 'macos-latest'
            name: 'macOS'
          - platform: 'ubuntu-22.04'
            name: 'Linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias del sistema en Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar dependencias de Node
        run: npm install

      - name: Generar iconos oficiales desde logo
        run: npx @tauri-apps/cli icon frontend/logo/r1.png

      - name: Compilar aplicación con Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v2.0.0
          releaseName: 'R1 Personalizados v2.0.0 Oficial'
          releaseBody: 'Instaladores nativos de R1 Personalizados compilados en la nube con Tauri v2.'
          releaseDraft: false
          prerelease: false

      - name: Subir instaladores de Windows (.exe / .msi)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Instaladores-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Subir instaladores de macOS (.dmg)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Instaladores-macOS
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Subir instaladores de Linux (.AppImage / .deb)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: Instaladores-Linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

